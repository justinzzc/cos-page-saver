<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云剪存配置</title><link rel="stylesheet" href="styles.css"></head>
<body class="options"><main class="settings-shell"><header><div class="brand"><span class="brand-mark">C</span><div><h1>云剪存</h1><p>连接你的腾讯云 COS 存储桶</p></div></div></header><section class="panel"><div class="panel-title"><h2>存储配置</h2><span>仅保存在本机</span></div><p class="notice">SecretId 和 SecretKey 会保存到 Chrome 本地扩展存储，不会发送到任何第三方服务器。请为 COS Bucket 配置允许本扩展来源的 CORS。</p><form id="settingsForm"><div class="grid"><label>Endpoint<input name="endpoint" placeholder="https://cos.ap-beijing.myqcloud.com" required></label><label>Region<input name="region" placeholder="ap-beijing" required></label><label>Access Key ID<input name="secretId" required></label><label>Secret Access Key<input name="secretKey" type="password" required></label><label>Bucket 名称<input name="bucket" placeholder="example-1256050948" required></label><label>对象前缀<input name="objectPrefix" value="clips"></label><label>S3 URL style<select name="urlStyle"><option value="virtualHosted">Virtual Hosted</option><option value="pathStyle">Path Style</option></select></label><label>分块并发度<input name="multipartConcurrency" type="number" min="1" max="50" value="20"></label></div><label class="checkbox"><input name="useAccurateModifiedTime" type="checkbox"> 使用准确的文件修改时间</label><div class="actions"><button class="primary" type="submit">保存配置</button><button id="testButton" class="secondary" type="button">测试 COS 连接</button><span id="message" class="status" role="status"></span></div></form></section><section class="tips"><h2>开始使用</h2><p>1. 填写 COS 信息并保存。<br>2. 打开一篇网页文章。<br>3. 点击扩展图标，选择“保存当前页面”。<br>4. 也可以在网页右键菜单中选择“保存到云剪存”。</p></section></main><script type="module" src="options.js"></script></body></html>
