<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云剪存配置</title><link rel="stylesheet" href="styles.css"></head>
<body class="options"><main class="settings-shell"><header><div class="brand"><span class="brand-mark">C</span><div><h1>云剪存</h1><p>管理多个腾讯云 COS 存储目标</p></div></div></header><section class="panel"><div class="panel-title"><h2>存储配置</h2><button id="newButton" class="secondary" type="button">新建配置</button></div><p class="notice">SecretId 和 SecretKey 仅保存在 Chrome 本地扩展存储，不会发送到第三方服务器。</p><div id="profileList" class="profile-list"></div></section><section class="panel editor-panel"><div class="panel-title"><h2 id="editorTitle">编辑配置</h2><span>仅保存在本机</span></div><form id="settingsForm"><div class="grid"><label>配置名称<input name="name" placeholder="例如：个人笔记" required></label><label>Endpoint<input name="endpoint" placeholder="https://cos.ap-beijing.myqcloud.com" required></label><label>Region<input name="region" placeholder="ap-beijing" required></label><label>Access Key ID<input name="secretId" required></label><label>Secret Access Key<div class="secret-field"><input name="secretKey" type="password" required><button id="toggleSecretButton" class="visibility-button" type="button" aria-label="显示密钥" title="显示密钥">◉</button></div></label><label>Bucket 名称<input name="bucket" placeholder="example-1256050948" required></label><label>对象前缀<input name="objectPrefix" value="clips"></label><label>S3 URL style<select name="urlStyle"><option value="virtualHosted">Virtual Hosted</option><option value="pathStyle">Path Style</option></select></label><label>分块并发度<input name="multipartConcurrency" type="number" min="1" max="50" value="20"></label></div><label class="checkbox"><input name="useAccurateModifiedTime" type="checkbox"> 使用准确的文件修改时间</label><div class="actions"><button class="primary" type="submit">保存配置</button><button id="testButton" class="secondary" type="button">测试 COS 连接</button><button id="defaultButton" class="secondary" type="button">设为默认</button><button id="deleteButton" class="secondary" type="button">删除</button><span id="message" class="status" role="status"></span></div></form></section><section class="tips"><h2>开始使用</h2><p>Popup 使用默认配置；网页右键菜单中第一项是默认配置，第二项是上一次使用的配置，随后列出其他配置。</p></section></main><script type="module" src="options.js"></script></body></html>
